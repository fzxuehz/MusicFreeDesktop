name: Build Custom Windows

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          echo "VERSION=$version" >> $env:GITHUB_ENV

      - name: Sanity check custom patches
        shell: pwsh
        run: |
          if (-not (Test-Path src/infra/pluginManager/main/builtinSources.ts)) { throw 'builtinSources.ts missing' }
          $hit1 = Select-String -Path src/infra/pluginManager/main/builtinSources.ts -SimpleMatch 'xhz_preset_gd.js'
          if (-not $hit1) { throw 'gd preset missing' }
          $hit2 = Select-String -Path src/infra/pluginManager/main/index.ts -SimpleMatch 'XHZ'
          if (-not $hit2) { throw 'pm patch missing' }
          $hit3 = Select-String -Path release/build-windows.iss -SimpleMatch 'XueHongzhong'
          if (-not $hit3) { throw 'iss patch missing' }
          Write-Host 'sanity check passed'

      - name: Package
        run: pnpm run package

      - name: Build setup with Inno
        uses: maotoumao/inno-setup-action-cli@main
        with:
          filepath: ./release/build-windows.iss
          variables: /DMyAppVersion=${{ env.VERSION }}

      - name: Rename setup file
        shell: pwsh
        run: |
          Rename-Item -Path "./out/MusicFreeSetup.exe" -NewName "xhz-music-${{ env.VERSION }}-win32-x64-setup.exe"

      - name: Make portable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "./out/MusicFree-win32-x64/portable" -Force | Out-Null

      - name: Archive portable
        shell: pwsh
        run: |
          Compress-Archive -Path "./out/MusicFree-win32-x64/*" -DestinationPath "./out/xhz-music-${{ env.VERSION }}-win32-x64-portable.zip"

      - name: Verify preset in packaged app
        shell: pwsh
        run: |
          $main_bundle = Get-ChildItem "./out/MusicFree-win32-x64/.webpack/main" -Filter *.js | Select-Object -First 5
          $found = $false
          foreach ($f in $main_bundle) {
            if ((Select-String -Path $f.FullName -SimpleMatch 'xhz_preset_gd.js' -Quiet)) { $found = $true }
          }
          if (-not $found) { throw 'preset sources not found in packaged main bundle' }
          Write-Host 'preset verified in package'

      - name: Upload setup
        uses: actions/upload-artifact@v4
        with:
          name: xhz-music-win-setup
          path: ./out/xhz-music-${{ env.VERSION }}-win32-x64-setup.exe
          if-no-files-found: error

      - name: Upload portable
        uses: actions/upload-artifact@v4
        with:
          name: xhz-music-win-portable
          path: ./out/xhz-music-${{ env.VERSION }}-win32-x64-portable.zip
          if-no-files-found: error
